name: Ghent cinema listings
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths: [scripts/cinemas.mjs, .github/workflows/cinemas.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/cinemas.mjs
      - name: Save the listings (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add screenings.json
          git diff --cached --quiet || (git commit -m "Update Ghent cinema listings" && git pull --rebase -q && git push)
