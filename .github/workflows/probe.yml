name: probe cinemas
on:
  push:
    branches: [claude/project-thread-qzn44h]
    paths: [scripts/probe.mjs, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: >
          node scripts/probe.mjs
          https://schoolofartsgent.be/en/artistic-activities/kask-cinema
          https://kaskcinema.be/
          https://www.sphinx-cinema.be/programma
          https://www.studioskoop.be/agenda-studio-skoop/
          https://cinevillepass.be/en-BE/showtimes
          https://cinevillepass.be/en-BE/cinemas/studio-skoop
          https://cinebel.dhnet.be/fr/cinema/994/Sphinx
