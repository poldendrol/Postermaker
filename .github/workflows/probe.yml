name: probe cinemas
on:
  push:
    branches: [claude/project-thread-qzn44h]
    paths: [scripts/probe.mjs, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs
